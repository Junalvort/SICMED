<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Get UID</title></head>
<body style="font-family:sans-serif;padding:40px;text-align:center">
  <h2>Obtener UID de admin</h2>
  <button id="loginBtn" style="padding:12px 24px;font-size:16px;cursor:pointer">
    Login con Google
  </button>
  <p id="result" style="margin-top:30px;font-size:18px;word-break:break-all"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } 
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
    apiKey:            "AIzaSyAbT9L872CeyMcIuwHtK5UjyA3jJKAF8i0",
    authDomain:        "derivmed.firebaseapp.com",
    projectId:         "derivmed",
    storageBucket:     "derivmed.firebasestorage.app",
    messagingSenderId: "742083987090",
    appId:             "1:742083987090:web:9c9c32ca82a82cd882484b"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById("loginBtn").onclick = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        document.getElementById("result").innerHTML = 
          `<b>Tu UID:</b><br><code style="background:#eee;padding:8px;display:inline-block;margin-top:10px">${result.user.uid}</code><br><br>Cópialo y guárdalo.`;
      } catch (e) {
        document.getElementById("result").textContent = "Error: " + e.message;
      }
    };
  </script>
</body>
</html>
